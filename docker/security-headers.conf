# Inclus dans chaque bloc qui declare ses propres en-tetes : nginx remplace
# les add_header herites des le qu'un bloc en definit un.
#
# Aucune exception au « tout local » : la page ne charge rien qu'elle ne
# serve elle-meme. Les trois schemas toleres — `data:` et `blob:` pour les
# images et les exports — restent des donnees produites par la page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "no-referrer" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
# Plus aucune fenetre tierce a laisser repondre : on peut refermer
# l'isolation completement.
add_header Cross-Origin-Opener-Policy "same-origin" always;
