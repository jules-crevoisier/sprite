# Inclus dans chaque bloc qui declare ses propres en-tetes : nginx remplace
# les add_header herites des le qu'un bloc en definit un.
#
# Les seules exceptions au « tout local » concernent Google Drive, et
# uniquement ce qu'il faut pour lui : le script de connexion, l'iframe qui
# renouvelle le jeton en silence, et les deux hotes d'API. Rien n'est
# telecharge tant que l'utilisateur n'ouvre pas une commande Drive.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data: https://accounts.google.com https://www.googleapis.com; frame-src https://accounts.google.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "no-referrer" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
# `same-origin` couperait la fenetre de connexion Google de la page qui
# l'ouvre : le jeton ne reviendrait jamais. La variante ...-allow-popups
# garde l'isolation de l'onglet tout en laissant ce dialogue repondre.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
