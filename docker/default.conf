# Service du site statique PixelForge.
# Le port 8080 permet de tourner en utilisateur non privilegie.
server {
    # IPv4 uniquement : les reseaux Docker le sont par defaut, et une pile
    # sans IPv6 ferait echouer le demarrage. Pour l'ajouter sur un hote
    # dual-stack : listen [::]:8080;
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Les fichiers .gz sont produits a la construction : nginx les sert tels
    # quels, sans recompresser a chaque requete.
    gzip_static on;
    gzip_vary   on;

    # Repli pour les rares clients sans variante precompressee.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    # L'application ne charge aucune ressource externe : la politique reste
    # stricte. blob: et data: servent aux exports (PNG, GIF, ZIP), aux images
    # importees et a l'icone de l'onglet.
    include /etc/nginx/security-headers.conf;

    # Sonde utilisee par le HEALTHCHECK et par l'orchestrateur.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Les noms produits par Vite contiennent un hash de contenu : pour une URL
    # donnee, le fichier ne changera jamais.
    location /assets/ {
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    # Le document d'entree doit toujours etre revalide, sinon un deploiement
    # laisse les navigateurs sur l'ancienne version.
    location = /index.html {
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
