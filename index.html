<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="PixelForge — éditeur de sprites et d'animation pixel art pour le game dev, dans le navigateur." />
  <meta name="thème-color" content="#0e1015" />
  <title>PixelForge — editeur de sprites pixel art</title>
  <!--
    Icone d'attente, le temps que les modules chargent. La vraie est Pixl,
    dessinee au demarrage depuis sa pose de repos : recopier ici les pixels
    de la mascotte donnerait une copie qui vieillirait toute seule des que
    les poses sont retouchees.
  -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23161020'/><rect x='4' y='4' width='8' height='8' fill='%23a678ff'/></svg>" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar" id="topbar"></header>
    <div class="optionsbar-wrap" id="optionsbar-wrap"><div class="optionsbar" id="optionsbar"></div></div>
    <main class="workspace">
      <aside class="toolbar" id="toolbar"></aside>
      <aside class="dock dock-left" id="dock-left"></aside>
      <div class="splitter" id="split-left" title="Glisser pour redimensionner"></div>
      <section class="canvas-area" id="canvas-area">
        <canvas id="canvas" class="canvas"></canvas>
        <div class="canvas-hud" id="canvas-hud"></div>
      </section>
      <div class="splitter" id="split-right" title="Glisser pour redimensionner"></div>
      <aside class="dock dock-right" id="dock-right"></aside>
    </main>
    <section class="timeline" id="timeline"></section>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <div class="overlay-root" id="overlay-root"></div>
  <div class="toast-root" id="toast-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
