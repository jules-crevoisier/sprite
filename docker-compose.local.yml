# Lancement sur une machine sans Dokploy : le port est publie sur l'hote.
#
#     docker compose -f docker-compose.local.yml up -d --build
#     # puis http://localhost:8080
#
# Changer le port hote si 8080 est deja pris :
#     PIXELFORGE_PORT=8090 docker compose -f docker-compose.local.yml up -d

services:
  pixelforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixelforge:latest
    restart: unless-stopped

    ports:
      - "${PIXELFORGE_PORT:-8080}:8080"

    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
